'CNRM-CM6-1' = [["futSST-pdSIC", "pdSST-pdSIC"], ["pdSST-futArcSIC", "pdSST-pdSIC"], ["futSST-futArcSIC-SUM", "pdSST-pdSIC"]]
'CanESM5' = [["futSST-pdSIC", "pdSST-pdSIC"], ["pdSST-futArcSIC", "pdSST-pdSIC"], ["futSST-futArcSIC-SUM", "pdSST-pdSIC"]]
'HadGEM3-GC31-MM' = [["futSST-pdSIC", "pdSST-pdSIC"], ["pdSST-futArcSIC", "pdSST-pdSIC"], ["futSST-futArcSIC-SUM", "pdSST-pdSIC"]]
