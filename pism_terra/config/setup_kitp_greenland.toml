ismip7_to_pism = {"acabf" = "climatic_mass_balance", "runoff" = "water_input_rate", "tas" = "ice_surface_temp", "TF" = "theta_ocean", "geothermal_heat_flux1" = "bheatflx"}
version = "v4"
bucket = "pism-cloud-data"
prefix = "kitp/input"
baseline = "hirham5"

[domain]

# Bounds computed with ``pism_terra.domain.get_bounds`` from the 150 m grid of
# GreenlandObsISMIP7-v1.3.nc (cell-edge extent x [-653000, 879700],
# y [-3384500, -632600]): same centre, with width and height rounded up to a
# multiple of 216 km (8 x 13 tiles), so that one domain serves many
# resolutions. Every divisor of 216 km fits evenly, e.g. 150, 300, 450, 600,
# 900, 1200, 1500, 1800, 2400, 3000, 3600, 4500, 4800, 6000, 9000, 18000 m.
# Reproduce with:
#   get_bounds(ds, base_resolution=150,
#              multipliers=[1, 2, 3, 4, 5, 6, 8, 9, 10, 12, 16, 18, 20, 24, 30, 32])
crs = "EPSG:3413"
resolution = "900m"
x_bounds = [-750650.0, 977350.0]
y_bounds = [-3412550.0, -604550.0]

[forcing]

bucket = "pism-cloud-data"
prefix = "kitp/kitp_forcing_v4"

