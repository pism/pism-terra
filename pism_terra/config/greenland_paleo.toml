[run_info]

'run_info.contact_email' = "aaschwanden@alaska.edu"
'run_info.contact_name' = "Andy Aschwanden"
'run_info.domain' = "GrIS"
'run_info.experiment' = "glacial_cycle"
'run_info.group' = "UAF"
'run_info.institution' = "University of Alaska Fairbanks"
'run_info.ism' = "PISM"
'run_info.model' = "PISM"
'run_info.title' = "PISM-TERRA Greenland Glacial Cycle Run"

[campaign]

# Grid, boot, heat-flux and initial-state files are the ISMIP7 Greenland ones
# and are staged from ``shared_prefix``; the base climate (1960-1989 monthly
# mean of OCX) and the SeaRISE series are built by pism-greenland-paleo-prepare
# and staged from ``<prefix>/<version>``.
boot_file = "boot_1985_g450m_GreenlandObsISMIP7-v1.3.nc"
bucket = "pism-cloud-data"
climate_file = "paleo_greenland_climate_OCX_YMM_1960_1989.nc"
delta_SL_file = "pism_dSL.nc"
delta_T_file = "pism_dT.nc"
grid_file = "pism_bedmachine_greenland_grid.nc"
heatflux_file  = "heatflux_g450m_GreenlandObsISMIP7-v1.3.nc"
ocean_delta_T_file = "pism_ocean_dT.nc"
ocean_file = "paleo_greenland_ocean_OCX_YMM_1960_1989.nc"
prefix = "paleo/greenland/input"
regrid_file = "g900m_1985_id_BAYES-MEDIAN_HYBRID.nc"
shared_prefix = "ismip7/greenland/input/v3"
version = "v1"

[time]

# Years relative to the reference date, negative before present.
'time.calendar' =  "365_day"
'time.reference_date' = "0001-01-01"
'time.start' = "-125000"
'time.end' = "0"

[time_stepping]

'time_stepping.skip.enabled' = "yes"
'time_stepping.skip.max' = 100

['geometry']

'geometry.front_retreat.use_cfl' = 'yes'
'geometry.part_grid.enabled' = 'yes'
'geometry.remove_icebergs' = 'yes'

['input']

'input.bootstrap' = "yes"
'input.file' = "none"
'input.forcing.buffer_size' = 400
'input.forcing.time_extrapolation' = "yes"
'input.regrid.file' =  "none"
# No ``age``: the initial state carries no age that means anything at -125 ka.
'input.regrid.vars' = "litho_temp,enthalpy,tillwat"

[age]

'age.enabled' = "yes"
# Ice present at the start has age zero then; PISM keeps ages non-negative.
'age.initial_value' = 0

[isochrones]

'isochrones.deposition_times' = 5000
'isochrones.max_n_layers' = 1000

[sea_level]

'ocean.delta_sl.file' = "none"
'sea_level.models' = "constant,delta_sl"

[reporting]

'output.checkpoint.interval' = 8
'output.compression_level' = 2
'output.format' = "netcdf4_serial"
'output.scalar.file' = "none"
'output.scalar.times' = "yearly"
'output.size' = "medium"
'output.sizes.medium' = "sftgif,velsurf_mag,mask,usurf,bmelt"
'output.snapshot.size' = "big_2d"
'output.snapshot.times' = "-120000,-100000,-75000,-50000,-25000,-20000,-15000,-10000,-5000,0"
'output.spatial.file' = "none"
'output.spatial.stop_missing' = 'no'
'output.spatial.times' = "100"
'output.spatial.vars' = "climatic_mass_balance,diffusivity,effective_air_temp,effective_precipitation,dHdt,ice_mass,isochrone_depth,isochronal_layer_thickness,mask,thk,topg,usurf,velbase_mag,velsurf_mag"

[grid]

'grid.Lbz' = 2000
'grid.Lz' = 5000
'grid.Mbz' = 21
'grid.Mz' = 501
'grid.allow_extrapolation' = "yes"
'grid.file' = "none"
'grid.registration' = "center"
resolution = "4500m"

[energy]

model = "enthalpy"

[energy.options.enthalpy]

'energy.bedrock_thermal.file' = "none"
'energy.minimum_allowed_temperature' = 0.0
'energy.model' = "enthalpy"
'stress_balance.sia.flow_law' = "gpbld"
'stress_balance.ssa.flow_law' = "gpbld"

[stress_balance]

model = 'hybrid'

[stress_balance.options.sia]

'stress_balance.model' = "sia"
'stress_balance.sia.max_diffusivity' = 1e6

[stress_balance.options.hybrid]

'stress_balance.calving_front_stress_bc' = 'yes'
'stress_balance.model' = "ssa+sia"
'stress_balance.sia.max_diffusivity' = 1e6
'stress_balance.ssa.method' = "fd"

[iceflow]

'basal_resistance.pseudo_plastic.enabled' = 'yes'
'basal_resistance.pseudo_plastic.q' = 0.7508221
'basal_yield_stress.model' = 'mohr_coulomb'
'basal_yield_stress.mohr_coulomb.till_effective_fraction_overburden' = 0.01845403
'basal_yield_stress.mohr_coulomb.topg_to_phi.enabled' = "yes"
'basal_yield_stress.mohr_coulomb.topg_to_phi.phi_max' = 42.79528
'basal_yield_stress.mohr_coulomb.topg_to_phi.phi_min' = 7.193718
'basal_yield_stress.mohr_coulomb.topg_to_phi.topg_max' = 243.8239
'basal_yield_stress.mohr_coulomb.topg_to_phi.topg_min' = -369.6359
'basal_yield_stress.slippery_grounding_lines' = "yes"
'stress_balance.ice_free_thickness_standard' = 5
'stress_balance.sia.enhancement_factor' = 2.608046
'stress_balance.ssa.Glen_exponent' = 3.309718

[atmosphere]

model = "paleo"

[atmosphere.options.paleo]

# Present-day monthly climatology, shifted by the ice-core temperature anomaly
# (delta_T), with precipitation scaled by the same anomaly (precip_scaling)
# and air temperature corrected for the changing surface (elevation_change).
'atmosphere.delta_T.file' = "none"
'atmosphere.elevation_change.file' = "none"
'atmosphere.elevation_change.temperature_lapse_rate' = 6
'atmosphere.given.file' = "none"
'atmosphere.given.periodic' = "yes"
'atmosphere.models' = "given,delta_T,precip_scaling,elevation_change"
'atmosphere.precip_scaling.file' = "none"

[atmosphere.options.given]

# Constant climate: the climatology alone.
'atmosphere.elevation_change.file' = "none"
'atmosphere.elevation_change.temperature_lapse_rate' = 6
'atmosphere.given.file' = "none"
'atmosphere.given.periodic' = "yes"
'atmosphere.models' = "given,elevation_change"

[surface]

model = "pdd"

[surface.options.pdd]

'surface.models' = "pdd"
'surface.pdd.air_temp_all_precip_as_rain' = 274.15
'surface.pdd.air_temp_all_precip_as_snow' = 272.15
'surface.pdd.refreeze' = 0.47
'surface.pdd.refreeze_ice_melt' = "no"

[calving]

'calving.methods' = 'vonmises_calving,thickness_calving'
'calving.thickness_calving.threshold' = 100
'calving.vonmises_calving.sigma_max' = 5e5

[ocean]

model = "th_delta_T"

[ocean.options.th]

'ocean.models' = "th"
'ocean.th.clip_salinity' = "yes"
'ocean.th.file' = "none"
'ocean.th.periodic' = "yes"
'ocean.th.temperature_as_thermal_forcing' = "yes"

[ocean.options.th_delta_T]

# PISM's ocean ``delta_T`` modifier offsets the ice-shelf-base temperature
# only: the melt rate ``th`` computes from the climatology does not see it.
'ocean.delta_T.file' = "none"
'ocean.models' = "th,delta_T"
'ocean.th.clip_salinity' = "yes"
'ocean.th.file' = "none"
'ocean.th.periodic' = "yes"
'ocean.th.temperature_as_thermal_forcing' = "yes"

[hydrology]

model = "null"

[hydrology.options.null]

'hydrology.model' = "null"
'hydrology.null_diffuse_till_water' = "yes"

[hydrology.options.routing]

'hydrology.model' = "routing"

[bed_deformation]

model="lc"

[bed_deformation.options.none]

'bed_deformation.model' = "none"

[bed_deformation.options.lc]

'bed_deformation.model' = "lc"
