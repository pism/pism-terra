# Case study 1 of the pism-terra model description paper: a hindcast of one
# RGI v7 glacier complex, the Wrangell Mountains (RGI2000-v7.0-C-01-04374,
# Alaska, 4129 km^2), from 1986 to 2025, compared with the observed surface
# elevation change of Hugonnet et al. (2021) over 2000-2020.
#
# The RGI ID is not part of the config; it is given on the command line (see
# docs/source/paper/case_study_1_glacier.md). The physics and parameters are
# those of s4f_historical_baseline_era5_pdd.toml, with only the option tables of
# the models this run selects kept: enthalpy, Blatter-Pattyn stress balance,
# positive-degree-day surface mass balance, given ERA5 atmosphere.

[run_info]

'run_info.institution' = "University of Alaska Fairbanks"
'run_info.title' = "PISM-TERRA case study 1: Wrangell Mountains glacier complex"

[campaign]

bathymetry = "gebco"
bucket = "pism-cloud-data"
climate = "era5"
dem = "glo_90"
dh = "hugonnet"
forcing_mask = "glacier"
heatflux = "lucazeau"
ice_thickness = "maffezzoli"
init_end = "0001-02-01"
init_forcing = "era5-monthly-mean"
init_start = "0001-01-01"
name = "gmd_case_study_1"
prefix = "glacier/input"
profile = true
project_directory = "s4f"
rgi_complex_file = "s4f_c.gpkg"
rgi_glacier_file = "s4f_g.gpkg"
velocity = "its_live"

[time]

'time.calendar' =  "standard"
'time.end' =  "2025-01-01"
'time.reference_date' = "1980-01-01"
'time.start' = "1986-01-01"

[time_stepping]

'time_stepping.skip.enabled' = "yes"
'time_stepping.skip.max' = 100

['geometry']

'geometry.front_retreat.use_cfl' = 'yes'
'geometry.part_grid.enabled' = 'yes'
'geometry.remove_icebergs' = 'yes'
'geometry.update.enabled' = "yes"

['input']

'input.bootstrap' = "yes"
'input.file' = "none"
'input.forcing.buffer_size' = 24
'input.forcing.time_extrapolation' = "yes"

[reporting]

'output.checkpoint.interval' = 24
'output.compression_level'= 2
'output.format' = "netcdf4_serial"
'output.scalar.times' = "daily"
'output.size' = "medium"
'output.sizes.medium' = "sftgif,velsurf_mag,mask,usurf"
'output.spatial.file' = "none"
'output.spatial.stop_missing' = 'no'
'output.spatial.times' = "monthly"
'output.spatial.vars' = "dHdt,velsurf_mag,velbase_mag,mask,usurf,pdd_fluxes,mass_fluxes,ice_mass,thk,sftgif"

[grid]

'grid.Lbz' = 0
'grid.Lz' = 2500
'grid.Mbz' = 1
'grid.Mz' = 251
'grid.file' = "none"
'grid.registration' = "center"
resolution = "200m"

[energy]

model = "enthalpy"

[energy.options.enthalpy]

'energy.bedrock_thermal.file' = "none"
'energy.model' = "enthalpy"
'stress_balance.blatter.flow_law' = "gpbld"
'stress_balance.sia.flow_law' = "gpbld"
'stress_balance.ssa.flow_law' = "gpbld"

[stress_balance]

model = 'blatter'

[stress_balance.options.blatter]

'stress_balance.blatter.Mz' = 10
'stress_balance.blatter.coarsening_factor' = 3
'stress_balance.blatter.use_eta_transform' = 'yes'
'stress_balance.calving_front_stress_bc' = 'no'
'stress_balance.model' = "blatter"
'stress_balance.sia.max_diffusivity' = 100000.0
'stress_balance.sia.surface_gradient_method' = 'eta'
'time_stepping.adaptive_ratio' = 500

[iceflow]

'basal_resistance.pseudo_plastic.enabled' = 'yes'
'basal_resistance.pseudo_plastic.q' = 0.75
'basal_resistance.pseudo_plastic.u_threshold' = '100m/yr'
'basal_yield_stress.model' = 'mohr_coulomb'
'basal_yield_stress.mohr_coulomb.till_effective_fraction_overburden' = 0.025
'basal_yield_stress.mohr_coulomb.till_phi_default' = 35
'stress_balance.blatter.Glen_exponent' = 3.0
'stress_balance.blatter.enhancement_factor' = 2.0
'stress_balance.sia.Glen_exponent' = 3.0
'stress_balance.sia.bed_smoother.range' = 5e2
'stress_balance.sia.enhancement_factor' = 2.0

[surface]

model = "pdd"

[surface.options.pdd]

'surface.models' = "pdd"
'surface.pdd.air_temp_all_precip_as_rain' = 275.15
'surface.pdd.air_temp_all_precip_as_snow' = 273.15
'surface.pdd.factor_ice' = 0.00879120879120879
'surface.pdd.factor_snow' = 0.0032967032967033
'surface.pdd.refreeze' = 0.6
'surface.pdd.refreeze_ice_melt' = "no"

[calving]

'calving.methods' = 'vonmises_calving'
'calving.vonmises_calving.sigma_max' = 7.5e5

[atmosphere]

model = "given"

[atmosphere.options.given]

'atmosphere.given.file' = "none"
'atmosphere.given.periodic' = "yes"
'atmosphere.models' = "given"

[ocean]

model = "constant"

[ocean.options.constant]

'ocean.constant.melt_rate' = 0.0
'ocean.models' = 'constant'

[hydrology]

model = "null"

[hydrology.options.null]

'hydrology.model' = "null"
'hydrology.null_diffuse_till_water' = "no"

[inverse]

'inverse.adjoint.method' =  "approximate"
'inverse.alternating_cycles' = 1
'inverse.alternating_misfit_tol' = 0.01
'inverse.design.cH1' = 1
'inverse.design.cL2' = 0
'inverse.design.param' = "exp"
'inverse.design.variable' = "tauc_hardav"
'inverse.file' = "none"
'inverse.huber.delta' =  1e2
'inverse.max_iterations' = 500
'inverse.state_func' = "huber"
'inverse.stress_balance.length_scale' = 1e3
'inverse.stress_balance.method' = "tikhonov_blmvm"
'inverse.stress_balance.tauc_max' = 1e8
'inverse.stress_balance.tauc_min' = 1e2
'inverse.stress_balance.velocity_scale' = 1e2
'inverse.tikhonov.penalty_weight' = 1000
'inverse.tikhonov.rtol' = 0.15
'inverse.use_zeta_fixed_mask' = "yes"

[solver.forward]

bp_ksp_rtol = 1e-3
bp_ksp_type = "fgmres"
bp_mg_coarse_ksp_max_it = 50
bp_mg_coarse_ksp_rtol = 1e-2
bp_mg_coarse_ksp_type = "gmres"
bp_mg_coarse_pc_type = "gamg"
bp_mg_levels_ksp_type = "richardson"
bp_mg_levels_pc_type = "sor"
bp_pc_mg_levels = 3
bp_pc_type = "mg"
bp_snes_ksp_ew = 1
bp_snes_ksp_ew_version = 3
bp_snes_rtol = 1e-3

[solver.inverse]

bp_ksp_rtol = 1e-4
bp_ksp_type = "fgmres"
bp_mg_coarse_ksp_max_it = 50
bp_mg_coarse_ksp_rtol = 1e-2
bp_mg_coarse_ksp_type = "gmres"
bp_mg_coarse_pc_type = "gamg"
bp_mg_levels_ksp_type = "chebyshev"
bp_pc_mg_levels = 3
bp_pc_type = "mg"
bp_snes_ksp_ew = 0
bp_snes_ksp_ew_version = 3
bp_snes_rtol = 1e-4
inv_adj_ksp_type = "gmres"
inv_adj_pc_type = "jacobi"
# TAO gradient-reduction stop: ||g_proj|| / ||g_0|| < gttol. Fires on glaciers whose
# Tikhonov rtol floor never drops below 0.15 (misfit within 0.1% of its plateau).
tao_gttol = 1e-3
